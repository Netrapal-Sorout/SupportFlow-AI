name: Deploy SupportFlow AI Backend

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::375886898285:role/GitHubActions-SupportFlowAI
          aws-region: eu-north-1

      - name: Deploy backend to Elastic Beanstalk
        uses: aws-actions/aws-elasticbeanstalk-deploy@v1
        with:
          aws-region: eu-north-1
          application-name: supportflow-ai
          environment-name: Supportflow-ai-env
          source-directory: backend