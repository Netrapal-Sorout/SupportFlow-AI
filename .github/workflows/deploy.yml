name: Deploy SupportFlow AI Backend

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Verify build output
        working-directory: backend
        run: |
          echo "===== DIST CONTENTS ====="
          ls -la dist

          echo "===== CHECK SERVER ====="
          test -f dist/server.js

          echo "✅ dist/server.js exists"

      - name: Remove node_modules
        run: |
          rm -rf backend/node_modules
          echo "✅ backend/node_modules removed"

      - name: Create deployment ZIP
        run: |
          cd backend

          zip -r ../supportflow-backend.zip . \
            -x "node_modules/*" \
            -x ".env" \
            -x ".git/*"

          cd ..

          echo "===== ZIP CONTENTS ====="
          unzip -l supportflow-backend.zip | grep "dist/server.js"

          echo "===== VERIFY ZIP ====="
          unzip -l supportflow-backend.zip | grep -q "dist/server.js"

          echo "✅ dist/server.js is inside deployment ZIP"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::375886898285:role/GitHubActions-SupportFlowAI
          aws-region: eu-north-1

      - name: Deploy to Elastic Beanstalk
        uses: aws-actions/aws-elasticbeanstalk-deploy@v1
        with:
          aws-region: eu-north-1
          application-name: supportflow-ai
          environment-name: Supportflow-ai-env
          deployment-package-path: supportflow-backend.zip
          version-label: supportflow-${{ github.sha }}
          wait-for-deployment: true
          wait-for-environment-recovery: true
          deployment-timeout: 1200